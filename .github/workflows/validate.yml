name: Validate dictionary

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build and validate distribution files
        run: python3 scripts/build_dist.py
      - name: Confirm generated files are current
        run: git diff --exit-code -- data dist
